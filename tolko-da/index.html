<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6fb">
<title>Только Да</title>
<style>
:root{--bg:#fff7fb;--card:#fff;--ink:#3b1834;--muted:#95778c;--pink:#ef4aa0;--pink2:#ff78bb;--line:#f1d9e6;--soft:#fff0f7;--shadow:0 22px 70px rgba(91,31,72,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:linear-gradient(180deg,#fff4fa 0,#fff 55%,#fff7fb 100%);color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}.app{min-height:100svh;display:flex;flex-direction:column;overflow:hidden;position:relative}.app:before,.app:after{content:"";position:fixed;border-radius:50%;filter:blur(20px);opacity:.55;pointer-events:none}.app:before{width:230px;height:230px;background:#ffd6ea;top:-80px;right:-70px}.app:after{width:180px;height:180px;background:#ffe7f2;bottom:-60px;left:-50px}.top{position:relative;z-index:2;padding:18px 20px 8px;text-align:center}.logo{font-weight:900;letter-spacing:-.04em;font-size:20px}.logo b{color:var(--pink)}.progress{height:4px;border-radius:99px;background:#f4e3ec;margin:14px auto 0;max-width:520px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pink2));transition:.35s}.stage{position:relative;z-index:1;flex:1;width:min(540px,calc(100% - 24px));margin:0 auto;display:grid;place-items:center;padding:12px 0 26px}.card{width:100%;background:rgba(255,255,255,.95);border:1px solid rgba(244,222,234,.95);border-radius:34px;box-shadow:var(--shadow);padding:34px 22px 26px;text-align:center;animation:cardIn .32s ease both}@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}.kicker{font-size:14px;font-weight:800;color:var(--pink);margin-bottom:16px}.illustration{width:116px;height:116px;border-radius:34px;background:linear-gradient(145deg,#fff0f7,#ffe3f0);display:grid;place-items:center;margin:0 auto 22px;box-shadow:inset 0 0 0 1px #f9dce9;position:relative}.illustration .big{font-size:54px;filter:drop-shadow(0 7px 8px rgba(122,35,87,.12))}.illustration:before,.illustration:after{content:"♥";position:absolute;color:#ff87bd;font-size:16px;animation:float 2.2s ease-in-out infinite}.illustration:before{top:12px;left:17px}.illustration:after{right:16px;bottom:13px;animation-delay:.55s;font-size:12px}@keyframes float{50%{transform:translateY(-5px) rotate(7deg)}}h1{margin:0 auto 12px;max-width:440px;font-size:clamp(30px,8.2vw,43px);line-height:1.02;letter-spacing:-.055em}p{margin:0 auto;max-width:400px;color:var(--muted);line-height:1.5;font-size:16px}.actions{display:grid;gap:10px;margin-top:26px}.btn{border:0;border-radius:18px;min-height:58px;padding:15px 18px;font-weight:850;font-size:17px;transition:.15s}.btn:active,.choice:active,.day:active{transform:scale(.98)}.primary{color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink2));box-shadow:0 12px 26px rgba(239,74,160,.24)}.secondary{background:var(--soft);color:var(--ink)}.ghost{background:transparent;color:var(--muted);min-height:44px;font-size:14px}.step{font-size:13px;font-weight:800;color:#c19aaf;margin-bottom:14px}.days{display:flex;gap:8px;overflow:auto;padding:3px 1px 8px;margin:20px -2px 0;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.day{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px 13px;color:var(--ink);font-weight:800}.day.on{background:var(--ink);border-color:var(--ink);color:#fff}.fields{display:grid;grid-template-columns:1.35fr .8fr;gap:10px;margin-top:12px;text-align:left}label{display:grid;gap:7px;font-size:12px;font-weight:800;color:var(--muted)}input{width:100%;height:56px;border:1.5px solid var(--line);border-radius:17px;background:#fff;color:var(--ink);padding:0 14px;outline:none}input:focus{border-color:#ef6aab;box-shadow:0 0 0 3px rgba(239,74,160,.09)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}.choice{min-height:106px;border:1.5px solid var(--line);background:#fff;border-radius:21px;padding:15px 10px;display:grid;place-content:center;gap:7px;color:var(--ink);font-weight:850;transition:.15s;position:relative}.choice .emoji{font-size:31px}.choice.on{border-color:var(--pink);background:var(--soft);box-shadow:0 0 0 3px rgba(239,74,160,.08)}.choice.on:after{content:"✓";position:absolute;top:8px;right:9px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:12px}.summary{margin-top:20px;border:1px solid var(--line);background:#fff8fc;border-radius:24px;padding:16px;text-align:left;display:grid;gap:13px}.row{display:flex;align-items:center;gap:11px}.ico{width:40px;height:40px;border-radius:13px;background:#fff;display:grid;place-items:center;font-size:19px}.row b{display:block;font-size:15px}.row small{color:var(--muted);display:block;margin-top:2px}.status{margin-top:16px;display:inline-flex;gap:7px;align-items:center;background:#eefaf3;color:#2f7c52;padding:9px 12px;border-radius:999px;font-size:13px;font-weight:850}.micro{margin-top:17px;font-size:13px;color:var(--muted)}.micro button{border:0;background:transparent;color:var(--pink);font-weight:900;padding:0}.error{margin-top:10px;color:#c63877;font-size:13px;font-weight:800}.footer{position:relative;z-index:2;text-align:center;padding:0 18px 20px;color:#b392a6;font-size:11px}@media(min-width:700px){.card{padding:42px 38px 32px}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="logo">только <b>да</b></div><div class="progress"><i id="bar"></i></div></header><main class="stage" id="root"></main><footer class="footer">интерактивное приглашение на свидание</footer></div>
<script>
const q=new URLSearchParams(location.search);const state={step:0,date:"",time:"18:30",activity:"",sender:q.get("from")||"Дима"};const root=document.getElementById("root"),bar=document.getElementById("bar");const acts=[["🍕","Пицца"],["🍣","Суши"],["🍔","Бургеры"],["🎬","Кино"],["🌙","Прогулка"],["🎳","Боулинг"]];function iso(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function pretty(v){return new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long"}).format(new Date(v+"T12:00:00"))}function go(n){state.step=n;render();scrollTo({top:0,behavior:"smooth"})}function card(inner){return `<section class="card">${inner}</section>`}function render(){bar.style.width=Math.min(100,state.step/4*100)+"%";if(state.step===0)root.innerHTML=card(`<div class="kicker">Тебе пришло приглашение 💌</div><div class="illustration"><div class="big">💖</div></div><h1>Пойдёшь со мной на свидание?</h1><p>${state.sender} хочет устроить маленький момент только для вас двоих.</p><div class="actions"><button class="btn primary" data-go="1">Да, конечно</button><button class="btn ghost" id="no">Не сейчас</button></div>`);if(state.step===1)root.innerHTML=card(`<div class="illustration"><div class="big">🥰</div></div><h1>Я знал, что ты согласишься!</h1><p>Теперь давай выберем детали. Это займёт меньше минуты.</p><div class="actions"><button class="btn primary" data-go="2">Давай</button></div>`);if(state.step===2){const days=[0,1,2,3,4].map(n=>{const d=iso(n),label=n===0?"Сегодня":n===1?"Завтра":new Intl.DateTimeFormat("ru-RU",{weekday:"short",day:"numeric"}).format(new Date(d+"T12:00:00"));return `<button class="day ${state.date===d?"on":""}" data-date="${d}">${label}</button>`}).join("");root.innerHTML=card(`<div class="step">1 из 2</div><div class="illustration"><div class="big">🗓️</div></div><h1>Когда тебе будет удобно?</h1><p>Выбери день и время встречи.</p><div class="days">${days}</div><div class="fields"><label>Дата<input id="date" type="date" min="${iso(0)}" value="${state.date}"></label><label>Время<input id="time" type="time" step="1800" value="${state.time}"></label></div><div id="err"></div><div class="actions"><button class="btn primary" id="nextDate">Выбрать</button><button class="btn ghost" data-go="1">Назад</button></div>`)}if(state.step===3)root.innerHTML=card(`<div class="step">2 из 2</div><div class="illustration"><div class="big">✨</div></div><h1>Что будем делать?</h1><p>Выбери то, что хочется больше всего.</p><div class="grid">${acts.map(a=>`<button class="choice ${state.activity===a[1]?"on":""}" data-act="${a[1]}"><span class="emoji">${a[0]}</span><span>${a[1]}</span></button>`).join("")}</div><div id="err"></div><div class="actions"><button class="btn primary" id="finish">Продолжить</button><button class="btn ghost" data-go="2">Назад</button></div>`);if(state.step===4)root.innerHTML=card(`<div class="illustration"><div class="big">💞</div></div><h1>Договорились!</h1><p>Встречаемся ${pretty(state.date)} в ${state.time}. В планах: ${state.activity}.</p><div class="summary"><div class="row"><div class="ico">📅</div><div><b>${pretty(state.date)}</b><small>Дата</small></div></div><div class="row"><div class="ico">🕒</div><div><b>${state.time}</b><small>Время</small></div></div><div class="row"><div class="ico">💗</div><div><b>${state.activity}</b><small>План</small></div></div></div><div class="status">✓ Ответ готов для ${state.sender}</div><div class="actions"><button class="btn primary" id="share">Поделиться планом</button><button class="btn secondary" id="again">Пройти ещё раз</button></div><div class="micro">Хочешь так же позвать? <button id="make">Создать приглашение →</button></div>`);bind()}function bind(){document.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>go(+x.dataset.go));document.querySelectorAll("[data-date]").forEach(x=>x.onclick=()=>{state.date=x.dataset.date;render()});document.querySelectorAll("[data-act]").forEach(x=>x.onclick=()=>{state.activity=x.dataset.act;render()});const no=document.getElementById("no");if(no)no.onclick=()=>{bar.style.width="0";root.innerHTML=card(`<div class="illustration"><div class="big">🌷</div></div><h1>Всё хорошо</h1><p>«Не сейчас» — тоже нормальный ответ.</p><div class="actions"><button class="btn secondary" id="backHome">Вернуться</button></div>`);document.getElementById("backHome").onclick=()=>go(0)};const nd=document.getElementById("nextDate");if(nd)nd.onclick=()=>{state.date=document.getElementById("date").value;state.time=document.getElementById("time").value;if(!state.date||!state.time){document.getElementById("err").innerHTML='<div class="error">Выбери дату и время</div>';return}go(3)};const f=document.getElementById("finish");if(f)f.onclick=()=>{if(!state.activity){document.getElementById("err").innerHTML='<div class="error">Выбери вариант</div>';return}go(4)};const sh=document.getElementById("share");if(sh)sh.onclick=async()=>{const text=`Договорились 💞 ${pretty(state.date)} в ${state.time} — ${state.activity}.`;if(navigator.share){try{await navigator.share({title:"Наше свидание",text});return}catch(e){}}try{await navigator.clipboard.writeText(text);sh.textContent="Скопировано ✓"}catch(e){sh.textContent="Готово ✓"}};const ag=document.getElementById("again");if(ag)ag.onclick=()=>{state.step=0;state.date="";state.activity="";render()};const mk=document.getElementById("make");if(mk)mk.onclick=()=>{const url=new URL(location.href);url.searchParams.set("from","Дима");navigator.clipboard?.writeText(url.href);mk.textContent="Ссылка скопирована ✓"}}render();
</script>
</body>
</html>
