<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7fb"><title>Только Да</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0,#ffd9ec,transparent 36%),#fff8fc;color:#35122f}.app{min-height:100svh;display:flex;flex-direction:column}.head{text-align:center;padding:22px;font-weight:900}.head b{color:#ed3f98}.progress{height:5px;background:#f1dce8;margin:0 22px;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#ed3f98;transition:.25s}.wrap{width:min(520px,calc(100% - 28px));margin:auto;padding:20px 0}.card{background:#fff;border:1px solid #f5e4ed;border-radius:32px;padding:30px 22px;text-align:center;box-shadow:0 22px 60px #61204a1c}.ey{font-size:14px;font-weight:800;color:#ed3f98;margin-bottom:16px}.emo{font-size:56px;margin:4px 0 18px}h1{font-size:clamp(30px,8vw,42px);line-height:1.04;letter-spacing:-.05em;margin:0 0 12px}p{color:#8c6c83;line-height:1.5;margin:0}.actions{display:grid;gap:10px;margin-top:25px}button,input{font:inherit}.btn{border:0;min-height:57px;border-radius:18px;padding:14px;font-weight:850;font-size:17px}.primary{color:#fff;background:linear-gradient(135deg,#ed3f98,#ff72b8)}.secondary{background:#fff0f7;color:#35122f}.ghost{background:transparent;color:#8c6c83}.fields{display:grid;gap:12px;margin-top:22px;text-align:left}label{font-size:13px;font-weight:800;color:#8c6c83;display:grid;gap:7px}input{height:56px;width:100%;border:1.5px solid #efd9e5;border-radius:17px;padding:0 14px;color:#35122f;background:#fff}.chips{display:flex;gap:8px;overflow:auto;margin:20px -2px 4px;padding:2px}.chip{white-space:nowrap;border:1px solid #efd9e5;border-radius:999px;background:#fff;padding:10px 13px;font-weight:800}.chip.on{background:#35122f;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.opt{min-height:100px;border:1.5px solid #efd9e5;border-radius:20px;background:#fff;font-weight:850;display:grid;place-content:center;gap:5px}.opt span{font-size:30px}.opt.on{border-color:#ed3f98;background:#fff0f7}.sum{margin-top:20px;border:1px solid #efd9e5;background:#fff8fc;border-radius:22px;padding:16px;text-align:left;display:grid;gap:13px}.row{display:flex;align-items:center;gap:11px}.ico{width:38px;height:38px;background:#fff;border-radius:12px;display:grid;place-items:center}.row small{display:block;color:#8c6c83;margin-top:2px}.status{margin-top:16px;font-size:13px;font-weight:800;color:#337b53;background:#effaf3;border-radius:999px;padding:9px 12px;display:inline-block}.foot{text-align:center;color:#ad8da2;font-size:11px;padding:20px}.error{color:#c82f72;font-size:13px;margin-top:10px;font-weight:750}</style></head><body><div class="app"><div class="head">только <b>да</b></div><div class="progress"><i id="bar"></i></div><main class="wrap" id="root"></main><div class="foot">Мобильный прототип v1</div></div><script>const state={step:0,date:'',time:'18:30',activity:'',sender:new URLSearchParams(location.search).get('from')||'Дима'};const root=document.getElementById('root'),bar=document.getElementById('bar');const acts=[['🍣','Суши'],['🍕','Пицца'],['🎬','Кино'],['🌙','Прогулка'],['🎳','Боулинг'],['☕️','Кофе']];function iso(n){let d=new Date;d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function pretty(v){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(new Date(v+'T12:00:00'))}function go(n){state.step=n;render();scrollTo(0,0)}function render(){bar.style.width=Math.min(100,state.step/4*100)+'%';if(state.step===0)root.innerHTML=`<div class="card"><div class="ey">Тебе пришло приглашение 💌</div><div class="emo">💖</div><h1>Пойдёшь со мной на свидание?</h1><p>${state.sender} хочет провести с тобой вечер.</p><div class="actions"><button class="btn primary" data-go="1">Да, конечно</button><button class="btn ghost" id="no">Не сейчас</button></div></div>`;if(state.step===1)root.innerHTML=`<div class="card"><div class="emo">🥰</div><h1>Я знал, что ты согласишься!</h1><p>Осталось выбрать пару деталей.</p><div class="actions"><button class="btn primary" data-go="2">Давай</button></div></div>`;if(state.step===2){let cs=[0,1,2,3].map(n=>{let d=iso(n),l=n===0?'Сегодня':n===1?'Завтра':new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric'}).format(new Date(d+'T12:00:00'));return `<button class="chip ${state.date===d?'on':''}" data-date="${d}">${l}</button>`}).join('');root.innerHTML=`<div class="card"><div class="ey">Шаг 1 из 2</div><h1>Когда тебе удобно?</h1><p>Выбери день и время встречи.</p><div class="chips">${cs}</div><div class="fields"><label>Дата<input id="date" type="date" min="${iso(0)}" value="${state.date}"></label><label>Время<input id="time" type="time" value="${state.time}" step="1800"></label></div><div id="err"></div><div class="actions"><button class="btn primary" id="nextDate">Продолжить</button><button class="btn ghost" data-go="1">Назад</button></div></div>`}if(state.step===3)root.innerHTML=`<div class="card"><div class="ey">Шаг 2 из 2</div><h1>Что будем делать?</h1><p>Выбери то, чего хочется больше всего.</p><div class="grid">${acts.map(a=>`<button class="opt ${state.activity===a[1]?'on':''}" data-act="${a[1]}"><span>${a[0]}</span>${a[1]}</button>`).join('')}<button class="opt ${state.activity==='Сюрприз'?'on':''}" data-act="Сюрприз"><span>✨</span>Сюрприз</button></div><div id="err"></div><div class="actions"><button class="btn primary" id="finish">Договорились</button><button class="btn ghost" data-go="2">Назад</button></div></div>`;if(state.step===4)root.innerHTML=`<div class="card"><div class="emo">💞</div><h1>Договорились!</h1><p>Встречаемся ${pretty(state.date)} в ${state.time}. В планах: ${state.activity}.</p><div class="sum"><div class="row"><div class="ico">📅</div><div><b>${pretty(state.date)}</b><small>Дата</small></div></div><div class="row"><div class="ico">🕒</div><div><b>${state.time}</b><small>Время</small></div></div><div class="row"><div class="ico">💗</div><div><b>${state.activity}</b><small>План</small></div></div></div><div class="status">✓ Ответ готов для ${state.sender}</div><div class="actions"><button class="btn primary" id="share">Поделиться планом</button><button class="btn secondary" id="again">Пройти ещё раз</button></div></div>`;bind()}function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(+x.dataset.go));document.querySelectorAll('[data-date]').forEach(x=>x.onclick=()=>{state.date=x.dataset.date;render()});document.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>{state.activity=x.dataset.act;render()});let no=document.getElementById('no');if(no)no.onclick=()=>{root.innerHTML='<div class="card"><div class="emo">🌷</div><h1>Всё хорошо</h1><p>«Не сейчас» — тоже нормальный ответ.</p><div class="actions"><button class="btn secondary" onclick="location.reload()">Вернуться</button></div></div>';bar.style.width='0'};let nd=document.getElementById('nextDate');if(nd)nd.onclick=()=>{state.date=document.getElementById('date').value;state.time=document.getElementById('time').value;if(!state.date||!state.time){document.getElementById('err').innerHTML='<div class="error">Выбери дату и время</div>';return}go(3)};let f=document.getElementById('finish');if(f)f.onclick=()=>{if(!state.activity){document.getElementById('err').innerHTML='<div class="error">Выбери вариант</div>';return}go(4)};let sh=document.getElementById('share');if(sh)sh.onclick=async()=>{let text=`Договорились 💞 ${pretty(state.date)} в ${state.time} — ${state.activity}.`;if(navigator.share){try{await navigator.share({title:'Наше свидание',text});return}catch(e){}}try{await navigator.clipboard.writeText(text);sh.textContent='Скопировано ✓'}catch(e){sh.textContent=text}};let ag=document.getElementById('again');if(ag)ag.onclick=()=>{state.step=0;state.date='';state.activity='';render()}}render();</script></body></html>
